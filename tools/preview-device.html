<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Emberwheel Device Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0d0b16; --fg: #e8dcc0; --muted: #8a80a8; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header a { color: var(--muted); text-decoration: none; }
  header a.on { color: #ffd257; }
  canvas { display: block; }
  #dom { padding: 8px 16px 24px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #dom img { background: #231f3d; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <strong>EMBERWHEEL — symbols &amp; device preview</strong>
  <a href="?s=all">all</a><a href="?s=device">device</a><a href="?s=symbols">symbols</a><a href="?s=icons">icons</a><a href="?s=props">lever &amp; candles</a><a href="?s=doors">doors</a>
  <span style="color:var(--muted)">(?s=…&amp;z=2 zooms; &amp;t=seconds freezes time)</span>
</header>
<canvas id="c"></canvas>
<div id="dom"></div>
<script src="../js/art/art_core.js"></script>
<script src="../js/art/symbols.js"></script>
<script src="../js/art/device.js"></script>
<script>
(function () {
  const Art = SD.Art, PAL = Art.PAL;
  const q = new URLSearchParams(location.search);
  const sec = q.get('s') || 'all', zoom = +q.get('z') || 1, freeze = q.get('t');
  document.querySelectorAll('header a').forEach(a => { if (a.getAttribute('href') === '?s=' + sec) a.classList.add('on'); });
  const W = 1320;
  const SECTIONS = {
    device: { h: 900, draw: drawDevice },
    symbols: { h: 640, draw: drawSymbols },
    icons: { h: 330, draw: drawIcons },
    props: { h: 330, draw: drawProps },
    doors: { h: 520, draw: drawDoors },
  };
  const list = sec === 'all' ? Object.keys(SECTIONS) : [sec].filter(s => SECTIONS[s]);
  const H = list.reduce((a, s) => a + SECTIONS[s].h, 0);
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  // crop mode (&vx=&vy=): fill the window with a zoomed region of the sheet — handy in narrow panes
  const crop = q.has('vx') || q.has('vy'), vx = +q.get('vx') || 0, vy = +q.get('vy') || 0;
  const CW = crop ? window.innerWidth - 4 : W * zoom, CH = crop ? window.innerHeight - 70 : H * zoom;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  cv.style.width = CW + 'px'; cv.style.height = CH + 'px';

  const label = (txt, x, y, col, align) => { ctx.save(); ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = col || '#a79fc6'; ctx.textAlign = align || 'center'; ctx.fillText(txt, x, y); ctx.restore(); };
  const title = (txt, y) => { ctx.save(); ctx.font = 'bold 15px system-ui, sans-serif'; ctx.fillStyle = '#ffd257'; ctx.fillText(txt, 16, y); ctx.restore(); };
  const loop = (t, period) => (t % period) / period;

  // ---------------------------------------------------------------- device
  const STRIPS = [
    ['blade', 'ward', 'flame', 'heart', 'blade', 'lantern', 'flame', 'ward', 'blade', 'heart'],
    ['flame', 'blade', 'heart', 'ward', 'blade', 'wild', 'lantern', 'heart', 'skull', 'ward'],
    ['heart', 'blade', 'ward', 'flame', 'lantern', 'blade', 'skull', 'ward', 'flame', 'blade'],
    ['ward', 'blade', 'heart', 'flame', 'blade', 'ward', 'lantern', 'flame', 'heart', 'blade'],
  ];
  function layout(n) {
    if (n === 4) return { x: 350, y: 446, w: 580, h: 268, rowH: 75, paylineY: 545, paylineH: 75, reels: [367, 507, 647, 787].map(x => ({ x, y: 470, w: 126, h: 225 })) };
    return { x: 350, y: 446, w: 580, h: 268, rowH: 75, paylineY: 545, paylineH: 75, reels: [397, 565, 733].map(x => ({ x, y: 470, w: 150, h: 225 })) };
  }
  function drawReels(L, t, spinIdx, specials, glow) {
    L.reels.forEach((r, i) => {
      const strip = STRIPS[i % STRIPS.length];
      ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
      const spin = i === spinIdx ? t * 260 : 0;
      const off = spin % L.rowH, base = Math.floor(spin / L.rowH);
      for (let k = -1; k <= 3; k++) {
        const idx = ((base - k + 2) % strip.length + strip.length) % strip.length;
        const id = strip[idx], cy = r.y + L.rowH / 2 + k * L.rowH + off;
        const mid = Math.abs(cy - (L.paylineY + L.paylineH / 2)) < L.rowH / 2;
        const sp = (specials && specials[i + ':' + idx]) || {};
        Art.drawSymbol(ctx, id, r.x + r.w / 2, cy, 62, { t, dim: mid ? 0 : 0.35, glow: mid && i !== spinIdx ? glow : 0, gilded: sp.g, cursed: sp.c });
      }
      ctx.restore();
    });
  }
  function stageBand(y0, t) {
    const g = ctx.createLinearGradient(0, y0, 0, y0 + 290);
    g.addColorStop(0, '#1a1630'); g.addColorStop(1, '#0d0b16');
    ctx.fillStyle = g; ctx.fillRect(0, y0, W, 290);
  }
  function drawDevice(t) {
    // A: 3 reels, all features animating
    const bands = [
      { n: 3, label: '3 reels · runes cycle · glow pulse · held[0] · jammed[2] · spinning reel 1', opts: (t) => ({ t, runes: Math.floor(t * 1.5) % 13, glow: 0.5 + 0.5 * Math.sin(t * 1.3), held: [true, false, false], jammed: [false, false, true] }), spin: 1, sp: { '2:5': { g: 1 }, '2:6': { c: 1 } } },
      { n: 4, label: '4 reels · boss (ash corruption) · runes 12 · held[1] · jammed[3]', opts: (t) => ({ t, runes: 12, glow: 0.3, held: [false, true, false, false], jammed: [false, false, false, true], boss: true }), spin: -1, sp: { '0:2': { c: 1 } } },
      { n: 3, label: '3 reels · plain (runes 4, glow 0)', opts: (t) => ({ t, runes: 4, glow: 0 }), spin: -1, sp: { '1:5': { g: 1 } } },
    ];
    bands.forEach((b, bi) => {
      const y0 = bi * 300;
      stageBand(y0, t);
      ctx.save(); ctx.translate(0, y0 - 430);
      const L = layout(b.n), o = b.opts(t);
      Art.drawDeviceBack(ctx, L, o);
      drawReels(L, t, b.spin, b.sp, o.glow);
      Art.drawDeviceFront(ctx, L, o);
      const lit = bi === 0 ? 3 - (Math.floor(t / 2) % 4) : bi === 1 ? 1 : 2;
      for (let i = 0; i < 4; i++) Art.drawSparkCandle(ctx, 586 + i * 36, 448, i < lit, t, { flare: bi === 0 && i === lit - 1 ? Math.max(0, 1 - loop(t, 2) * 3) : 0 });
      Art.drawLever(ctx, 985, 640, bi === 0 ? Art.pulse(loop(t, 1.6), 0.3) : 0, t, { hover: bi === 2, boss: bi === 1 });
      ctx.restore();
      label(b.label, 16, y0 + 18, '#a79fc6', 'left');
      if (bi === 0) label('runes=' + o.runes + '  glow=' + o.glow.toFixed(2), 16, y0 + 36, '#6c64a0', 'left');
    });
  }

  // ---------------------------------------------------------------- symbols
  const STATES = [
    ['normal', {}], ['gilded', { gilded: true }], ['cursed', { cursed: true }], ['dim .6', { dim: 0.6 }], ['glow 1', { glow: 1 }], ['gild+curse', { gilded: true, cursed: true }],
  ];
  function drawSymbols(t) {
    title('Symbols — 64px (left block) and 44px (right block) on the stone drum colour', 22);
    const ids = Art.SYMBOL_IDS;
    ctx.fillStyle = '#3a3460'; ctx.fillRect(110, 34, 6 * 84 + 10, ids.length * 82 + 6);
    ctx.fillStyle = '#3a3460'; ctx.fillRect(110 + 6 * 84 + 30, 34, 6 * 62 + 10, ids.length * 82 + 6);
    ids.forEach((id, r) => {
      const y = 78 + r * 82;
      label(id, 60, y + 4, Art.SYMBOL_COLORS[id]);
      STATES.forEach(([nm, o], c) => {
        Art.drawSymbol(ctx, id, 160 + c * 84, y, 64, Object.assign({ t }, o));
        Art.drawSymbol(ctx, id, 110 + 6 * 84 + 30 + 36 + c * 62, y, 44, Object.assign({ t }, o));
        if (r === 0) { label(nm, 160 + c * 84, 30, '#8a80a8'); label(nm, 110 + 6 * 84 + 30 + 36 + c * 62, 30, '#8a80a8'); }
      });
    });
    // large showcase
    ids.forEach((id, i) => Art.drawSymbol(ctx, id, 1135 + (i % 2) * 90, 90 + Math.floor(i / 2) * 120, 80, { t, glow: 0.35 + 0.35 * Math.sin(t * 2 + i) }));
  }

  // ---------------------------------------------------------------- icons
  function drawIcons(t) {
    title('Icons — 48px (top) / 32px (bottom)', 22);
    const names = Art.ICON_NAMES;
    names.forEach((n, i) => {
      const col = i % 14, row = Math.floor(i / 14);
      const x = 50 + col * 90, y = 70 + row * 140;
      ctx.fillStyle = '#231f3d'; ctx.fillRect(x - 38, y - 34, 76, 112);
      Art.drawIcon(ctx, n, x, y, 48, { t });
      Art.drawIcon(ctx, n, x, y + 54, 32, { t });
      label(n, x, y + 94, '#a79fc6');
    });
  }

  // ---------------------------------------------------------------- lever + candles
  function drawProps(t) {
    title('Lever (pull loop / hover / disabled / held pulled) · Spark candles', 22);
    ctx.fillStyle = '#17142a'; ctx.fillRect(0, 34, W, 296);
    const p = Art.pulse(loop(t, 1.2), 0.3);
    const levers = [['pull loop', p, {}], ['hover', 0, { hover: true }], ['disabled', 0, { disabled: true }], ['pull 0.5', 0.5, {}], ['pull 1', 1, {}]];
    levers.forEach(([nm, pp, o], i) => { Art.drawLever(ctx, 110 + i * 150, 220, pp, t, o); label(nm, 90 + i * 150, 320); });
    const cand = [['lit', true, {}], ['unlit', false, {}], ['flare loop', true, { flare: Art.pulse(loop(t, 1.2), 0.2) }], ['lit size 44', true, { size: 44 }], ['unlit size 44', false, { size: 44 }]];
    cand.forEach(([nm, lit, o], i) => { Art.drawSparkCandle(ctx, 860 + i * 92, 230, lit, t, o); label(nm, 860 + i * 92, 320); });
  }

  // ---------------------------------------------------------------- doors
  function drawDoors(t) {
    title('Doors — closed (hover toggles every 1.5s on odd ones) / opening loop', 22);
    ctx.fillStyle = '#17142a'; ctx.fillRect(0, 34, W, 486);
    const kinds = ['battle', 'dread', 'shrine', 'campfire', 'elite', 'boss'];
    const hv = Math.floor(t / 1.5) % 2 === 0;
    const op = Art.easeInOut(Math.min(1, loop(t, 3) * 1.6));
    kinds.forEach((k, i) => {
      const x = 110 + i * 205;
      Art.drawDoor(ctx, k, x, 150, 120, 170, t, { hover: i % 2 ? hv : false });
      label(k + (i % 2 ? (hv ? ' (hover)' : '') : ''), x, 262);
      Art.drawDoor(ctx, k, x, 392, 120, 170, t, { open: op });
      label(k + ' open ' + op.toFixed(2), x, 504);
    });
  }

  function frame(now) {
    const t = freeze != null ? +freeze : now / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d0b16'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -vx * zoom * dpr, -vy * zoom * dpr);
    let y = 0;
    for (const s of list) {
      ctx.save(); ctx.translate(0, y); ctx.beginPath(); ctx.rect(0, 0, W, SECTIONS[s].h); ctx.clip();
      SECTIONS[s].draw(t);
      ctx.restore();
      y += SECTIONS[s].h;
    }
    if (freeze == null) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // DOM check: iconCanvas / symbolCanvas -> toDataURL
  if (sec === 'all' || sec === 'icons') {
    const dom = document.getElementById('dom');
    const add = (cv, tip) => { if (!cv) return; const im = new Image(); im.src = cv.toDataURL(); im.title = tip; im.width = cv.width; dom.appendChild(im); };
    Art.ICON_NAMES.forEach(n => add(Art.iconCanvas(n, 40), n));
    Art.SYMBOL_IDS.forEach(id => { add(Art.symbolCanvas(id, 56), id); add(Art.symbolCanvas(id, 56, { gilded: true }), id + ' gilded'); });
  }
})();
</script>
</body>
</html>
